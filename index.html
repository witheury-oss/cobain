<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplorasi AR Papua 3D</title>
    <!-- Import library model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Latar belakang estetik bernuansa gelap/alam */
            background: linear-gradient(135deg, #1a252f, #2c3e50);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            color: #d35400; /* Warna aksen tanah/papua */
        }
        p {
            margin-top: 5px;
            font-weight: 300;
            color: #bdc3c7;
            font-size: 0.9em;
        }
        model-viewer {
            width: 100%;
            height: 75vh;
            background-color: transparent;
            --poster-color: transparent;
        }
        /* Desain tombol AR */
        .ar-button {
            background-color: #d35400;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.4);
            transition: all 0.3s ease;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }
        .ar-button:hover {
            background-color: #e67e22;
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.6);
        }
        .ar-button:active {
            background-color: #a04000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pesona Papua 3D</h1>
        <p>Geser untuk memutar objek. Tekan tombol AR untuk memunculkan di dunia nyata.</p>
    </div>

    <!-- Menampilkan model 3D dan mengaktifkan AR -->
    <model-viewer
        src="papua.gltf" 
        alt="Model 3D Papua"
        auto-rotate
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        environment-image="neutral"
        shadow-intensity="1.5"
        exposure="1">
        
        <button slot="ar-button" class="ar-button">
            📸 Tampilkan di Ruangan Anda
        </button>
    </model-viewer>
</body>
</html>
